description = "使用 AI 分析變更並生成符合最佳實踐的正體中文 commit message"
prompt = """
請協助我完成 Git commit 流程。請根據目前的變更內容、最近的提交風格以及以下規範，生成一個高品質的正體中文 commit message。

### 1. 目前的 Git 狀態
!{git status}

### 2. 已暫存的變更內容 (git diff --staged)
!{git diff --staged}

### 3. 最近 5 次提交記錄 (風格參考)
!{git log --oneline -5}

### 4. Commit Message 撰寫規範

#### Conventional Commits 格式
```
<type>(<scope>): <description>

[optional body]

[optional footer]
```

#### Type 類型 (必填)
- `feat`: 新功能
- `fix`: 錯誤修復
- `docs`: 文件變更
- `style`: 程式碼格式調整(不影響邏輯)
- `refactor`: 重構(既非新功能也非錯誤修復)
- `test`: 測試相關
- `chore`: 雜項(建置流程、依賴更新等)
- `perf`: 效能優化
- `ci`: CI/CD 相關
- `build`: 建置系統或外部依賴變更

#### Scope 範圍 (選填)
指出變更影響的範圍，例如: `(admin)`, `(ui)`, `(api)`, `(auth)` 等

#### Description 描述 (必填)
- **使用祈使語氣**: 「新增」而非「新增了」或「正在新增」
- **限制 50 字元以內**: 保持簡潔
- **首字大寫**: 提高可讀性
- **不加句號**: 這是標題而非句子
- **說明「做什麼」和「為什麼」**: 而非「如何做」

#### Body 內文 (選填)
- 與 description 之間空一行
- 每行限制 72 字元
- 提供更詳細的變更說明、動機或設計決策

#### 注意事項
1. **人工審核**: 確保準確描述變更內容。
2. **一次一個邏輯變更**: 每個 commit 應該只包含一個邏輯變更。
3. **保持一致性**: 參考專案歷史記錄，維持風格一致。
4. **正體中文**: 使用正體中文撰寫，保持專業且清晰。

---

**請執行以下分析並提供結果：**

1.  **內容分析**：簡述你觀察到的變更重點。
2.  **生成訊息**：根據上述規範生成建議的 commit message。
3.  **執行提交**：請直接調用 `run_shell_command` 執行 `git commit -m "<標題>" -m "<內文>"` 指令。

如果沒有任何已暫存 (staged) 的變更，請提醒我先使用 `git add` 暫存變更。
"""