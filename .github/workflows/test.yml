name: CodeMask CI

on:
  push:
    branches: [ "main", "prod" ]
  pull_request:
    branches: [ "main", "prod" ]

jobs:
  test:
    name: Build and Test
    runs-on: macos-14
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      
    - name: Run Tests
      run: |
        xcodebuild test \
          -project CodeMask/CodeMask.xcodeproj \
          -scheme CodeMask \
          -destination 'platform=macOS' \
          -enableCodeCoverage YES
